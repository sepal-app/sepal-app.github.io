<nav class="docs-nav" aria-label="Documentation">
    <p class="docs-nav__title">Documentation</p>
    <ul>
        {{ $current := . }}
        {{ range (site.GetPage "/docs").RegularPages.ByWeight }}
        <li>
            <a href="{{ .RelPermalink }}"{{ if eq . $current }} class="is-active" aria-current="page"{{ end }}>{{ .Title }}</a>
        </li>
        {{ end }}
    </ul>
</nav>
