{{/* hreflang links to each translation of the page, with English as the
     default for any language the site does not have. */}}
{{ if .IsTranslated }}
{{ range .AllTranslations }}<link rel="alternate" hreflang="{{ .Language.Locale }}" href="{{ .Permalink }}">
{{ if eq .Language.Lang hugo.Sites.Default.Language.Lang }}<link rel="alternate" hreflang="x-default" href="{{ .Permalink }}">
{{ end }}{{ end }}
{{ end }}
