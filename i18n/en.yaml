# Landing page: questions

faq_title:
  other: "Common questions"
faq_compare_question:
  other: "How does Sepal compare to other plant collection management systems?"
faq_compare_answer:
  other: "Plant collections management software is generally built for large institutions and priced accordingly. Sepal covers the core of collection management for a lower cost, aimed at smaller gardens and individual collectors who don't need the full feature set. Sepal is also open source, so you can choose to export your records at any time and run your own instance of Sepal."
faq_import_question:
  other: "Can I bring existing records in?"
faq_import_answer:
  other: "Yes. Spreadsheet import is supported, and we'll help map columns from another system."
faq_leave_question:
  other: "What if I stop using the hosted service?"
faq_leave_answer:
  other: "Export everything, then run the open source application on your own infrastructure."
faq_trial_question:
  other: "Do I need to pay to try it?"
faq_trial_answer:
  other: "No. Signup doesn't require a credit card and comes with either a 14- or 30-day free trial period. If you need to extend your trial just contact us."

