baseURL = "https://sepal.app/"
title = "Sepal"

# Search engines ask for /robots.txt before they crawl, and a 404 there leaves
# the sitemap undiscoverable to any crawler that was not handed it directly.
enableRobotsTXT = true

# taxonomy and term are off because docs and blog carry no tags; leaving them
# on emits empty /categories/ and /tags/ feeds and a build warning.
disableKinds = ["taxonomy", "term"]

[outputs]
  # robots.txt is an output of the home node, so enableRobotsTXT on its own
  # emits nothing once this table names any kind: home falls back to its
  # defaults, which do not include robots.
  home = ["html", "rss", "robots"]
  section = ["html", "rss"]

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

# Syntax highlighting is off. Code samples here are shell commands and search
# queries, which highlighting does little for, and turning it on means either
# inline styles on every token or a generated stylesheet that lives outside
# site.css. Code blocks are styled in docs.css instead.
[markup.highlight]
  codeFences = false

# English is served from the site root and Spanish from /es/. Only pages with
# an .es.md file, and the landing page, exist in Spanish.
[languages.en]
  locale = "en"
  label = "English"
  weight = 1
[languages.es]
  locale = "es"
  label = "Español"
  weight = 2
