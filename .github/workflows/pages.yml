name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Kept in step with devenv.nix by hand. devenv resolves its hugo from
      # devenv.lock; this pins a literal so a CI build is reproducible on its
      # own. Hugo breaks little between releases.
      HUGO_VERSION: 0.166.0
      PAGEFIND_VERSION: 1.5.2
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          curl -sSLo hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf hugo.tar.gz hugo
          sudo mv hugo /usr/local/bin/
          hugo version

      - name: Install Pagefind
        run: |
          curl -sSLo pagefind.tar.gz \
            "https://github.com/Pagefind/pagefind/releases/download/v${PAGEFIND_VERSION}/pagefind-v${PAGEFIND_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf pagefind.tar.gz pagefind
          sudo mv pagefind /usr/local/bin/
          pagefind --version

      - name: Build
        run: |
          # Hugo renders the English for a string missing from es.yaml, and
          # warns only when asked. With no es.yaml at all it does not warn.
          set -o pipefail
          test -f i18n/es.yaml || { echo "::error::i18n/es.yaml is missing"; exit 1; }
          hugo --minify --printI18nWarnings 2>&1 | tee hugo.log
          if grep MISSING_TRANSLATION hugo.log; then
            echo "::error::A string has no translation. Run bin/translate for the language named above."
            exit 1
          fi
          pagefind --site public

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
